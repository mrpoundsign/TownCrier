name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - name: Compute Release Metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
            IS_TAG="true"
          else
            RAW_VER="0.1.0-snapshot"
            TAG_NAME="v${RAW_VER}"
            IS_TAG="false"
          fi
          IS_PRERELEASE="false"
          if [[ "${RAW_VER}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Lint, WASM Build & Test Suite
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Download Go Modules
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-linux

      - name: Check Go Modernization
        run: |
          DIFF="$(go fix -diff ./...)"
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Build PoundControl WASM Plugin
        run: |
          chmod +x ./build.sh
          VERSION="${{ needs.meta.outputs.version }}" ./build.sh wasm

      - name: Run Full Test Suite
        run: |
          chmod +x ./build.sh
          ./build.sh test

  build-linux-windows:
    name: Build & Package Desktop GUI (Windows, Linux & WASM)
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Cross-Compilation & Packaging Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip \
            cmake ninja-build glslc libvulkan-dev spirv-headers \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Download Go Modules
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-windows
          go mod download github.com/k2-fsa/sherpa-onnx-go-linux

      - name: Build & Package Windows, Linux & WASM Distributions
        run: |
          chmod +x ./build.sh ./scripts/build-whisper-vulkan.sh
          ./build.sh win
          ./build.sh linux
          ./build.sh wasm
          ./build.sh package

      - name: Upload Windows, Linux & WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/

  build-macos:
    name: Build & Package Desktop GUI (macOS)
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download Go Modules
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-macos

      - name: Build & Package macOS Distribution
        run: |
          chmod +x ./build.sh ./scripts/build-whisper-vulkan.sh
          ./build.sh mac
          ./build.sh package-mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  release:
    name: Consolidate Artifacts, Attest & Publish Release
    needs: [meta, test, build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Consolidate Checksums
        run: |
          mkdir -p dist
          cd dist
          rm -f checksums.txt SHA256SUMS.txt
          TMP_SUMS="$(mktemp)"
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> "$TMP_SUMS"
          done
          sort -u -k2 -o checksums.txt "$TMP_SUMS"
          rm -f "$TMP_SUMS"
          cp -f checksums.txt SHA256SUMS.txt
          echo "=== Final Consolidated dist/checksums.txt ==="
          cat checksums.txt

      - name: Attest Build Provenance (SLSA OIDC)
        if: needs.meta.outputs.is_tag == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub Release
        if: needs.meta.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=(--verify-tag --generate-notes)
            if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
          ASSETS=()
          for f in dist/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
