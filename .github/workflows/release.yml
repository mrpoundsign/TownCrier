name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.0.1)'
        required: false
        default: '0.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Cross-Compilation & Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev

      - name: Determine Release Version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER="${{ github.event.inputs.version || '0.0.1' }}"
            RAW_VER="${RAW_VER#v}"
            TAG_NAME="v${RAW_VER}"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Build & Package Windows Release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x ./build.sh
          ./build.sh all

      - name: Generate SHA256 Checksum
        run: |
          cd dist
          sha256sum TownCrier-v${{ steps.meta.outputs.version }}-windows-amd64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TownCrier ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/TownCrier-v${{ steps.meta.outputs.version }}-windows-amd64.zip
            dist/SHA256SUMS.txt
