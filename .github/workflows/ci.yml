name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Cache Go Modules & golangci-lint-v2
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin/golangci-lint-v2
          key: ${{ runner.os }}-gomod-v2.14.0-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-v2.14.0-

      - name: Restore Go Build & Linter Cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-gobuild-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-gobuild-${{ steps.go.outputs.go-version }}-

      - name: Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Download Go Modules
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-linux

      - name: Install golangci-lint-v2 (Cached)
        run: |
          if [ ! -x "$HOME/go/bin/golangci-lint-v2" ]; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$HOME/go/bin" v2.14.0
            mv -f "$HOME/go/bin/golangci-lint" "$HOME/go/bin/golangci-lint-v2"
          fi

      - name: Run Quality Gate (go fix --diff, golangci-lint-v2, go test)
        run: |
          chmod +x ./build.sh
          ./build.sh lint
          ./build.sh test

      - name: Save Go Build & Linter Cache
        if: ${{ always() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-gobuild-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
