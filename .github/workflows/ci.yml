name: CI Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev

      - name: Verify Code Modernization (go fix --diff)
        run: |
          DIFF=$(go fix --diff ./... 2>&1 || true)
          if [ -n "$DIFF" ]; then
            echo "Unfixed modernization diffs found:"
            echo "$DIFF"
            exit 1
          fi

      - name: Install and Run golangci-lint-v2
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./...

      - name: Run Test Suite
        run: go test -count=1 -v ./...

  windows-build:
    name: Windows Native Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run Unit Tests
        run: go test -count=1 -v ./...

      - name: Build OctochorpeBot Executable
        run: |
          go build -trimpath -ldflags="-H windowsgui -s -w" -o build/bin/OctochorpeBot.exe ./cmd/octochorpebot
