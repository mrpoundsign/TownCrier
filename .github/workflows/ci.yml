name: CI Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Cache Go Modules, Build Artifacts & golangci-lint
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/bin/golangci-lint
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
          save-always: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Download Go Modules
        run: go mod download

      - name: Install golangci-lint v2 (Cached)
        run: |
          if [ ! -x "$HOME/go/bin/golangci-lint" ]; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$HOME/go/bin" v2.14.0
          fi

      - name: Run Quality Gate (go fix --diff, golangci-lint, go test)
        run: |
          chmod +x ./build.sh
          ./build.sh lint
          ./build.sh test

  windows-build:
    name: Windows Native Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Cache Windows Go Modules & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-
          save-always: true

      - name: Download Go Modules & Add Sherpa DLLs to PATH
        shell: bash
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-windows
          WIN_MOD_DIR=$(go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows)
          if [ -n "$WIN_MOD_DIR" ] && [ -d "$WIN_MOD_DIR/lib/x86_64-pc-windows-gnu" ]; then
            echo "$WIN_MOD_DIR/lib/x86_64-pc-windows-gnu" >> "$GITHUB_PATH"
          fi

      - name: Run Unit Tests
        run: go test -count=1 -v ./...

      - name: Build TownCrier Core Executable
        run: |
          go build -trimpath -ldflags="-H windowsgui -s -w" -o build/bin/towncrier-core.exe ./cmd/towncrier
