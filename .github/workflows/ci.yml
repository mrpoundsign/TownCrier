name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'build.sh'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Download Go Modules
        run: |
          go mod download
          go mod download github.com/k2-fsa/sherpa-onnx-go-linux

      - name: Check Go Modernization
        run: |
          DIFF="$(go fix -diff ./...)"
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Build PoundControl WASM Plugin
        run: |
          chmod +x ./build.sh
          ./build.sh wasm

      - name: Run Full Test Suite
        run: |
          chmod +x ./build.sh
          ./build.sh test
